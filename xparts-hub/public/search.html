<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหาข้อมูล | XParts Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { 'x-green': '#caff04', 'x-red': '#ff003c', 'x-dark': '#09090b' } } } };
  </script>
  <link rel="stylesheet" href="style.css">
  
</head>
<body class="bg-halftone min-h-screen pb-20">
  <header class="bg-zinc-950 border-b-4 border-x-green sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex flex-col xl:flex-row items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3">
        <div class="font-x text-4xl italic font-bold flex">
          <span class="text-white text-shadow-none">XPARTS</span><span class="c-x-green ml-1 transform scale-110 text-shadow-none">HUB</span>
        </div>
        <span class="hidden md:block text-[10px] text-zinc-500 tracking-[3px] font-bold">BEYBLADE X DATABASE</span>
      </a>
      <nav class="flex flex-wrap justify-center gap-2 items-center">
        <a href="index.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">HOME</a>
        <a href="about.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">ABOUT X</a>
        <a href="beyblades.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">BEYBLADE</a>
        <a href="blade.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">BLADE</a>
        <a href="ratchet.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">RATCHET</a>
        <a href="bit.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">BIT</a>
        <a href="rules.html" class="slanted bg-zinc-800 text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700 transition-colors">RULES</a>
        <a href="search.html" class="slanted bg-x-green text-black font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-black">SEARCH</a>
        <a href="login.html" id="nav-login" class="slanted bg-x-red text-white font-x text-lg md:text-xl px-4 pt-2 pb-1 border-2 border-black hover:bg-white hover:text-black transition-colors">LOGIN</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 mt-8 max-w-6xl relative space-y-10">

    <div class="text-center">
      <h2 class="font-x text-5xl md:text-6xl italic text-shadow-none">SEARCH</h2>
      <p class="font-bold text-white bg-black inline-block px-4 py-1 box-cut mt-2">ค้นหาเบย์เบลดและชิ้นส่วนทุกประเภทจากฐานข้อมูล</p>
    </div>
    <div class="bg-white border-[3px] border-black box-cut p-6 max-w-3xl mx-auto">
      <div class="flex flex-col md:flex-row gap-3">
        <input id="search-input" type="text" placeholder="พิมพ์ชื่อ เช่น Dran, 3-60, Flat..." class="field flex-1 border-2 border-black p-3 font-bold">
        <select id="search-col" class="field border-2 border-black p-3 bg-white font-bold">
          <option value="all">ทุกประเภท</option>
          <option value="beys">เบย์เบลด</option>
          <option value="blades">Blade</option>
          <option value="ratchets">Ratchet</option>
          <option value="bits">Bit</option>
        </select>
      </div>
      <p id="search-status" class="text-xs text-zinc-500 font-bold mt-3">พิมพ์เพื่อค้นหาจากฐานข้อมูลทั้งหมด</p>
    </div>
    <div id="search-results" class="space-y-10"></div>
  </main>

  <footer class="bg-black text-zinc-400 py-8 mt-16 border-t-8 border-x-red text-center">
    <div class="font-x text-3xl text-white mb-2 italic text-shadow-none">XPARTS <span class="c-x-green">HUB</span></div>
    <p class="text-[10px] font-bold">BEYBLADE X DATABASE &middot; EDUCATION PROJECT</p>
  </footer>

  <script src="store.js"></script>
  <script src="auth.js"></script>
  <script>
    // Swap LOGIN -> ADMIN when already logged in.
    XPartsAuth.me().then(function () {
      var b = document.getElementById('nav-login');
      if (b) { b.textContent = 'ADMIN'; b.href = 'admin.html'; }
    }).catch(function () {});
  </script>
  <script>
  (function () {
    var LABELS = { beys: 'BEYBLADE', blades: 'BLADE', ratchets: 'RATCHET', bits: 'BIT' };
    var input = document.getElementById('search-input');
    var colSel = document.getElementById('search-col');
    var out = document.getElementById('search-results');
    var status = document.getElementById('search-status');
    var timer = null;

    function run() {
      var q = input.value.trim().toLowerCase();
      var which = colSel.value === 'all' ? Object.keys(LABELS) : [colSel.value];
      Promise.all(which.map(function (c) { return window.XPartsDB.col(c).all().then(function (rows) { return { col: c, rows: rows }; }); }))
        .then(function (groups) {
          var total = 0, html = '';
          groups.forEach(function (g) {
            var rows = g.rows.filter(function (x) {
              if (!q) return true;
              return String(x.name).toLowerCase().indexOf(q) >= 0 ||
                     String(x.description || '').toLowerCase().indexOf(q) >= 0 ||
                     String(x.type || '').toLowerCase().indexOf(q) >= 0;
            });
            total += rows.length;
            if (rows.length) {
              html += '<div><h3 class="font-x text-3xl border-b-[3px] border-black pb-2 mb-4">' + LABELS[g.col] +
                ' <span class="c-x-red">(' + rows.length + ')</span></h3>' +
                '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">' +
                rows.map(function (x) { return window.XPartsDB.card(x, x.type || LABELS[g.col]); }).join('') + '</div></div>';
            }
          });
          out.innerHTML = total ? html : window.XPartsDB.empty(q ? 'ไม่พบข้อมูลที่ตรงกับ "' + window.XPartsDB.esc(q) + '"' : 'ยังไม่มีข้อมูลในระบบ');
          status.textContent = 'พบ ' + total + ' รายการ';
        });
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 250); });
    colSel.addEventListener('change', run);
    window.addEventListener('xparts:changed', run);
    run();
  })();
  </script>
</body>
</html>
