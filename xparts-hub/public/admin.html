<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin | XParts Hub</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { 'x-green': '#caff04', 'x-red': '#ff003c' } } } };
  </script>
  <link rel="stylesheet" href="style.css">
  <style>
    .thumb { width:64px; height:64px; object-fit:contain; background:#fff; flex-shrink:0; }
  </style>
</head>
<body class="bg-halftone min-h-screen pb-20">
  <header class="bg-zinc-950 border-b-4 border-x-green sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
      <a href="index.html" class="font-x text-4xl italic font-bold"><span class="text-white">XPARTS</span><span class="c-x-green ml-1">HUB</span></a>
      <nav class="flex gap-2 items-center">
        <a href="index.html" class="slanted bg-zinc-800 text-white font-x text-xl px-5 pt-2 pb-1 border-2 border-transparent hover:bg-zinc-700">HOME</a>
        <span class="slanted bg-x-green text-black font-x text-xl px-5 pt-2 pb-1 border-2 border-black">ADMIN PANEL</span>
        <a href="#" id="logout-btn" class="slanted bg-x-red text-white font-x text-xl px-5 pt-2 pb-1 border-2 border-black hover:bg-black">LOGOUT</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 mt-8 max-w-6xl space-y-8">
    <section class="box-cut bg-zinc-950 text-white p-7 md:p-10 border-l-8 border-x-green">
      <p class="text-xs tracking-[4px] text-zinc-500">XPARTS MANAGEMENT SYSTEM</p>
      <h1 class="font-x text-5xl md:text-7xl italic">DATABASE <span class="c-x-green">MANAGER</span></h1>
      <p class="text-zinc-400 font-bold">จัดการข้อมูลเบย์เบลด ชิ้นส่วน และหมวดหมู่ที่จะแสดงบนหน้าเว็บ</p>
      <p class="text-xs text-zinc-500 mt-3">STORAGE: <span id="storage-mode" class="text-x-green font-bold"></span> &middot; USER: <span id="current-user" class="text-x-green font-bold">-</span></p>
      <p class="text-[10px] text-zinc-600 mt-1">SERVER VERSION: <span id="server-version">-</span></p>
      <p id="backup-bar" class="hidden text-xs mt-3 font-bold">
        <a href="/api/backup" class="c-x-green underline">⬇ ดาวน์โหลดข้อมูลสำรอง (JSON)</a>
        <span class="text-zinc-600 mx-2">|</span>
        <label class="c-x-green underline cursor-pointer">⬆ กู้คืนจากไฟล์สำรอง<input id="restore-file" type="file" accept=".json,application/json" class="hidden"></label>
      </p>
    </section>

    <div id="admin-tabs" class="flex flex-wrap gap-2"></div>
    <div id="admin-root"></div>
  </main>

  <script src="auth.js"></script>
  <script src="store.js"></script>
  <script>
    XPartsAuth.guard().then(function (u) {
      document.getElementById('current-user').textContent = u.email || 'admin';
    });
    document.getElementById('storage-mode').textContent =
      (location.protocol === 'http:' || location.protocol === 'https:') ? 'SERVER (JSON files)' : 'LOCAL (เบราว์เซอร์นี้เท่านั้น)';
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      fetch('/api/version').then(function (r) { return r.json(); }).then(function (v) {
        document.getElementById('server-version').textContent = v.version;
      }).catch(function () { document.getElementById('server-version').textContent = 'เก่ามาก (ไม่มี /api/version)'; });
    } else {
      document.getElementById('server-version').textContent = '-';
    }
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      document.getElementById('backup-bar').classList.remove('hidden');
      document.getElementById('restore-file').addEventListener('change', function (e) {
        var f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        f.text().then(function (t) {
          var data;
          try { data = JSON.parse(t); } catch (err) { alert('ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง'); return; }
          if (!confirm('กู้คืนจากไฟล์สำรอง? ข้อมูลหมวดที่อยู่ในไฟล์จะถูกแทนที่ทั้งหมด (รูปภาพที่อัปโหลดไว้ไม่รวมในไฟล์สำรอง)')) return;
          fetch('/api/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
            .then(function (r) { return r.json().then(function (v) { if (!r.ok) throw new Error(v.error || 'กู้คืนไม่สำเร็จ'); return v; }); })
            .then(function (v) { alert('กู้คืนแล้ว: ' + v.restored.join(', ')); location.reload(); })
            .catch(function (err) { alert(err.message); });
        });
      });
    }
    document.getElementById('logout-btn').addEventListener('click', function (e) {
      e.preventDefault();
      XPartsAuth.logout().then(function () { location.href = 'login.html'; });
    });
  </script>
  <script src="admin.js"></script>
</body>
</html>
